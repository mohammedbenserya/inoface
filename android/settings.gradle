pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.1.0" apply false
    id "org.jetbrains.kotlin.android" version "2.4.0" apply false
    id "com.google.gms.google-services" version "4.4.4" apply false
}

include ":app"

gradle.beforeProject { project ->
    def buildFile = project.buildFile
    if (buildFile.exists()) {
        def original = buildFile.getText('UTF-8')
        def updated = original
        if (updated.contains('jcenter()')) {
            updated = updated.replace('jcenter()', 'mavenCentral()')
        }
        // AGP 9 dropped getDefaultProguardFile('proguard-android.txt').
        if (updated.contains("proguard-android.txt")) {
            updated = updated.replace("proguard-android.txt", "proguard-android-optimize.txt")
        }
        // AGP 9 built-in Kotlin rejects plugins that still apply kotlin-android.
        updated = updated.replaceAll(/(?m)^[ \t]*apply plugin: ['"]kotlin-android['"][ \t]*\r?\n/, "")
        updated = updated.replaceAll(/(?m)^[ \t]*apply plugin: ['"]org.jetbrains.kotlin.android['"][ \t]*\r?\n/, "")
        updated = updated.replaceAll(/(?m)^[ \t]*id ['"]kotlin-android['"][ \t]*\r?\n/, "")
        updated = updated.replaceAll(/(?m)^[ \t]*id ['"]org.jetbrains.kotlin.android['"][ \t]*\r?\n/, "")
        // AGP 9 built-in Kotlin has no android.kotlinOptions {} on library modules.
        updated = updated.replaceAll(/(?s)[ \t]*kotlinOptions\s*\{[^{}]*\}[ \t]*\r?\n/, "")
        if (updated != original) {
            buildFile.write(updated, 'UTF-8')
        }
    }
    // Play Photo/Video policy: strip READ_MEDIA_* that plugins (open_filex) inject.
    def pluginManifest = project.file("src/main/AndroidManifest.xml")
    if (pluginManifest.exists()) {
        def originalManifest = pluginManifest.getText('UTF-8')
        def updatedManifest = originalManifest
            .replaceAll(/(?m)^[ \t]*<uses-permission[^>]*android:name="android\.permission\.READ_MEDIA_(IMAGES|VIDEO|AUDIO|VISUAL_USER_SELECTED)"[^>]*\/?>[ \t]*\r?\n?/, "")
        if (updatedManifest != originalManifest) {
            pluginManifest.write(updatedManifest, 'UTF-8')
        }
    }
    project.fileTree(dir: project.projectDir, include: "**/*.java").each { javaFile ->
        def originalJava = javaFile.getText('UTF-8')
        if (!originalJava.contains("READ_MEDIA_IMAGES")) {
            return
        }
        def updatedJava = originalJava
            .replace("requestPermission(Manifest.permission.READ_MEDIA_IMAGES);", "startActivity();")
            .replace("requestPermission(Manifest.permission.READ_MEDIA_VIDEO);", "startActivity();")
            .replace("requestPermission(Manifest.permission.READ_MEDIA_AUDIO);", "startActivity();")
        if (updatedJava != originalJava) {
            javaFile.write(updatedJava, 'UTF-8')
        }
    }
    def aliasJcenter = { handler ->
        handler.metaClass.jcenter = { Object... args ->
            handler.mavenCentral()
        }
    }
    aliasJcenter(project.buildscript.repositories)
    aliasJcenter(project.repositories)
}
